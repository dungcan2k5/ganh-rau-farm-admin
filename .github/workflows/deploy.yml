name: Build and Deploy to VPS

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Admin App
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: dungcan2k5/ganh-rau-farm-admin:latest
        build-args: |
          VITE_API_URL=${{ secrets.VITE_API_URL }}
          VITE_SUPABASE_API_KEY=${{ secrets.VITE_SUPABASE_API_KEY }}

  deploy-to-vps:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4 # Phải checkout lại để lấy file docker-compose.yml

    - name: Copy docker-compose.yml to VPS
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_KEY }}
        port: 22
        source: "docker-compose.yml" # File ở local (root project)
        target: "/home/zun/ganh-rau-admin" # Thư mục trên VPS

    - name: Deploy to VPS via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_KEY }}
        port: 22
        script: |
          mkdir -p /home/zun/ganh-rau-admin
          cd /home/zun/ganh-rau-admin
          
          # Ghi đè file .env chứa TOKEN cloudflared
          echo "TUNNEL_TOKEN=${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}" > .env
          
          # Pull image mới
          docker pull dungcan2k5/ganh-rau-farm-admin:latest
          
          # Chạy lại
          docker compose down
          docker compose up -d
          
          # Dọn dẹp
          docker image prune -f
